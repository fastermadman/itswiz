name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Same command as .githooks/pre-push. No dependencies, so no npm cache.
      - run: node --check plugin/main.js && node --test plugin/test/*.test.js
