<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>VIAstudyWiz — indstillinger</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1.5rem; max-width: 360px; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.75rem; }
    input[type="number"], input[type="text"] { width: 8rem; margin-left: 0.5rem; }
    button { margin-top: 0.5rem; }
    #status { margin-left: 0.75rem; color: green; }
  </style>
</head>
<body>
  <h2>VIAstudyWiz — indstillinger</h2>

  <fieldset>
    <legend>Tidsinterval</legend>
    <label>Dage bagud: <input type="number" id="daysBack" min="0" /></label>
    <label>Dage fremad: <input type="number" id="daysForward" min="0" /></label>
  </fieldset>

  <fieldset>
    <legend>Automatisk kørsel</legend>
    <label>Kør hver <input type="number" id="alarmIntervalHours" min="1" /> time</label>
  </fieldset>

  <fieldset>
    <legend>Hvad skal ske ved hver kørsel</legend>
    <label><input type="checkbox" id="enableFileDownloads" /> Download PDF/Office-filer</label>
    <label><input type="checkbox" id="enableCalendarSync" /> Synkronisér til Google Calendar</label>
    <label><input type="checkbox" id="enableMetadataExport" /> Gem rå JSON-metadata (trigger Chromes gem-dialog, kun til debugging)</label>
    <label><input type="checkbox" id="enableTaskCompletionSync" /> Marker Forberedelse som fuldført i itslearning når den er krydset af i noten (skriver til skolens system, kun [ ]→[x], aldrig omvendt)</label>
  </fieldset>

  <fieldset>
    <legend>Vault-mappe</legend>
    <button id="chooseVaultDir">Vælg vault-mappe…</button>
    <div id="vaultDirStatus">Ingen mappe valgt endnu.</div>
  </fieldset>

  <button id="save">Gem</button>
  <span id="status"></span>
  <script src="fsHandle.js"></script>
  <script src="options.js"></script>
</body>
</html>
